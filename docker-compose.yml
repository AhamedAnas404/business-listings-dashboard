services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: business_dashboard
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: dashboard123
      MYSQL_ROOT_PASSWORD: rootdev123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
